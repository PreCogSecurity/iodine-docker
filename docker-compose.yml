# One-command startup: docker compose up -d
# Copy .env.example to .env and set IODINE_HOST / IODINE_PASSWORD first.
#
# These flags grant the minimum iodine needs to create its TUN interface:
#   NET_ADMIN  create and configure the tunnel interface
#   MDEV       create the /dev/net/tun node when the host node is not mounted
# --privileged is NOT required. See "Security Notes" in the README before
# reaching for it.
services:
  iodine:
    build: .
    image: wingrunr21/iodine-docker
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - MDEV
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    ports:
      - "53:53/udp"
    environment:
      IODINE_HOST: ${IODINE_HOST:?IODINE_HOST must be set (see .env.example)}
      # Prefer IODINE_PASSWORD_FILE (a mounted secret) over IODINE_PASSWORD;
      # see the README for the Compose `secrets:` equivalent.
      IODINE_PASSWORD: ${IODINE_PASSWORD:?IODINE_PASSWORD must be set (see .env.example)}
      IODINE_TUNNEL_IP: ${IODINE_TUNNEL_IP:-10.0.0.1}
    restart: unless-stopped
    stop_grace_period: 10s
    # Bound the container log on the host disk, like the in-container cap the
    # entrypoint applies to /var/log/iodined.log.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"