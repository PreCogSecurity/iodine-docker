# One-command startup: docker compose up -d
# Copy .env.example to .env and set IODINE_HOST / IODINE_PASSWORD first.
services:
  iodine:
    build: .
    image: wingrunr21/iodine-docker
    # Iodine needs a TUN/TAP device; see "Security Notes" in the README.
    privileged: true
    ports:
      - "53:53/udp"
    environment:
      IODINE_HOST: ${IODINE_HOST:?IODINE_HOST must be set (see .env.example)}
      IODINE_PASSWORD: ${IODINE_PASSWORD:?IODINE_PASSWORD must be set (see .env.example)}
      IODINE_TUNNEL_IP: ${IODINE_TUNNEL_IP:-10.0.0.1}
    restart: unless-stopped
